services:
  postgres:
    image: postgres:16-alpine
    restart: always
    # Password comes from the untracked .env file; never inline it here.
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adfilter}
      POSTGRES_DB: ${POSTGRES_DB:-adfilter}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adfilter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    # The database password is supplied from the untracked .env file.
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # Standard libpq variables; the `pg` driver reads these directly.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-adfilter}
      PGDATABASE: ${POSTGRES_DB:-adfilter}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: