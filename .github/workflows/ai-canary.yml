name: AI Canary Sentinel

on:
  schedule:
    # Chạy tự động lúc 07:00 sáng giờ Việt Nam (00:00 UTC) mỗi ngày
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      canary_urls:
        description: 'Danh sách URL kiểm tra (cách nhau bằng dấu phẩy)'
        required: false
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'

permissions:
  contents: read
  issues: write

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Chromium extension
        run: pnpm build

      - name: Run AI Canary Sentinel
        env:
          CANARY_URLS: ${{ github.event.inputs.canary_urls || vars.CANARY_URLS || 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm canary:ai

      - name: Upload AI Canary Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-canary-report
          path: canary-ai-report.md
          if-no-files-found: ignore
