name: infra-plan
on:
  pull_request:
    paths: ['infra/**']

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-southeast-1
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: >-
          terraform -chdir=infra init
          -backend-config=bucket=${{ vars.TFSTATE_BUCKET }}
          -backend-config=key=prod/terraform.tfstate
          -backend-config=region=ap-southeast-1
          -backend-config=encrypt=true
      - name: Plan
        env:
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_github_repo: ${{ github.repository }}
        run: |
          terraform -chdir=infra plan -lock=false -no-color -input=false > plan.txt
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
