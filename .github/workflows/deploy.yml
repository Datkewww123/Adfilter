name: deploy
on:
  push:
    branches: [main]
    paths: ['server/**', 'docker/**', 'docker-compose*.yml', 'deploy/**']
  workflow_dispatch:
    inputs:
      tag:
        description: SHA can trien khai lai (de trong de build tu HEAD)
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TAG: ${{ inputs.tag || github.sha }}
      REGION: ap-southeast-1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - id: ecr
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build va day anh (neu chua co)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/adfilter-api:${TAG}
          if aws ecr describe-images --repository-name adfilter-api --image-ids imageTag=$TAG --region $REGION > /dev/null 2>&1; then
            echo "Anh $TAG da co, bo qua build"
          else
            docker build -t "$IMAGE" server
            docker push "$IMAGE"
          fi
      - name: Tai goi trien khai len S3
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          tar czf deploy.tgz docker-compose.yml docker-compose.prod.yml docker deploy
          aws s3 cp deploy.tgz s3://${{ vars.ARTIFACT_BUCKET }}/deploy/${TAG}.tgz --region $REGION
      - name: Trien khai qua SSM va doi ket qua
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        run: |
          CMD="mkdir -p /opt/adfilter/releases/${TAG} && aws s3 cp s3://${{ vars.ARTIFACT_BUCKET }}/deploy/${TAG}.tgz /tmp/deploy.tgz --region $REGION && tar xzf /tmp/deploy.tgz -C /opt/adfilter/releases/${TAG} && chmod +x /opt/adfilter/releases/${TAG}/deploy/deploy.sh && /opt/adfilter/releases/${TAG}/deploy/deploy.sh ${TAG}"
          jq -n --arg c "$CMD" '{commands: [$c]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids ${{ vars.EC2_INSTANCE_ID }} --document-name AWS-RunShellScript --parameters file://params.json --query Command.CommandId --output text --region $REGION)
          echo "CMD_ID=$CMD_ID" >> "$GITHUB_ENV"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id ${{ vars.EC2_INSTANCE_ID }} --region $REGION
      - name: In log trien khai khi that bai
        if: failure() && vars.AWS_DEPLOY_ROLE_ARN != ''
        run: >-
          aws ssm get-command-invocation --command-id "$CMD_ID"
          --instance-id ${{ vars.EC2_INSTANCE_ID }} --region $REGION
          --query '[StandardOutputContent,StandardErrorContent]' --output text
