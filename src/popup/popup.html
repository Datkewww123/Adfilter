<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>AdFilter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        background-color: #ffffff;
        color: #111827;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .title {
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge-stealth {
        background-color: #ecfdf5;
        color: #059669;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 9999px;
        border: 1px solid #a7f3d0;
      }
      .status-box {
        background-color: #f3f4f6;
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        color: #374151;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      .site-card {
        background-color: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .site-domain {
        font-size: 12px;
        font-weight: 600;
        color: #1f2937;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .site-status {
        font-size: 11px;
        color: #059669;
        font-weight: 500;
      }
      .site-status.disabled {
        color: #dc2626;
      }
      .toggle-btn {
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        background: #ffffff;
        cursor: pointer;
        transition: all 0.2s;
      }
      .toggle-btn:hover {
        background: #f3f4f6;
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn {
        width: 100%;
        padding: 8px 12px;
        background-color: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">🛡️ AdFilter</div>
      <div class="badge-stealth" id="stealthBadge">Stealth Bật</div>
    </div>

    <div class="site-card" id="siteCard">
      <div>
        <div class="site-domain" id="siteDomain">Trang web hiện tại</div>
        <div class="site-status" id="siteStatus">Đang bảo vệ</div>
      </div>
      <button class="toggle-btn" id="siteToggleBtn">Tạm dừng</button>
    </div>

    <div class="status-box" id="status">Đang theo dõi luồng phát...</div>

    <div class="btn-row">
      <button class="btn" id="exportLogs">Xuất nhật ký (JSON)</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
