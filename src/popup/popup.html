<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>AdFilter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        background-color: #ffffff;
        color: #111827;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .title {
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge-stealth {
        background-color: #ecfdf5;
        color: #059669;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 9999px;
        border: 1px solid #a7f3d0;
      }
      .status-box {
        background-color: #f3f4f6;
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        color: #374151;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      .btn-row {
        display: flex;
        gap: 8px;
      }
      .btn {
        width: 100%;
        padding: 8px 12px;
        background-color: #f3f4f6;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">🛡️ AdFilter</div>
      <div class="badge-stealth">Stealth Bật</div>
    </div>

    <div class="status-box" id="status">Đang theo dõi luồng phát...</div>

    <div class="btn-row">
      <button class="btn" id="exportLogs">Xuất nhật ký (JSON)</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
