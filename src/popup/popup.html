<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>AdFilter</title>
    <style>
      body {
        font: 14px system-ui, sans-serif;
        width: 260px;
        margin: 12px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      #out div {
        margin: 2px 0;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      button {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>AdFilter</h1>
    <div id="out">Đang tải...</div>
    <label><input type="checkbox" id="enabled" /> Bật extension</label>
    <label><input type="checkbox" id="dryRun" /> Chế độ dry-run (chỉ ghi log)</label>
    <button id="export">Xuất log</button>
    <script src="popup.js"></script>
  </body>
</html>
